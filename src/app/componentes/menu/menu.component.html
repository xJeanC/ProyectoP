<header class="ic-header sticky-top">
  <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/principal" (click)="cerrar()">
        <img src="assets/img/helado.png" alt="" width="36" height="36">
        <span>IceCul</span>
      </a>

      <button class="navbar-toggler" type="button"
              [attr.aria-expanded]="abierto" aria-controls="menuPrincipal"
              aria-label="Abrir menú" (click)="abierto = !abierto">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal" [class.show]="abierto">
        <ul class="navbar-nav ms-auto">
          @for (enlace of enlaces; track enlace.ruta) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="enlace.ruta"
                 routerLinkActive="active" ariaCurrentWhenActive="page"
                 (click)="cerrar()">{{ enlace.texto }}</a>
            </li>
          }
        </ul>
        <a class="btn btn-primary ms-lg-3 mt-2 mt-lg-0" [href]="whatsapp"
           target="_blank" rel="noopener">Pide por WhatsApp</a>
      </div>
    </div>
  </nav>
</header>
