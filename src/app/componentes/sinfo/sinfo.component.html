<section class="ic-seccion">
  <div class="container">
    <div class="row align-items-center g-4 g-lg-5">
      <div class="col-12 col-lg-7">
        <span class="ic-eyebrow">Información</span>
        <h1 class="ic-titulo">¿En qué te podemos ayudar?</h1>
        <p class="ic-lead mb-4">Elige una opción y completa el formulario. Guardamos tus datos y puedes enviárnoslos por WhatsApp.</p>

        <div class="d-grid gap-3">
          @for (opcion of opciones; track opcion.ruta) {
            <a class="ic-card ic-opcion" [routerLink]="opcion.ruta">
              <span class="ic-opcion__icono" aria-hidden="true">{{ opcion.icono }}</span>
              <span class="flex-grow-1">
                <strong>{{ opcion.titulo }}</strong>
                <span class="ic-opcion__texto">{{ opcion.texto }}</span>
              </span>
              <span class="ic-opcion__flecha" aria-hidden="true">→</span>
            </a>
          }
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <img class="ic-foto ic-info__foto" src="assets/img/icecul.jpeg" alt="Logo de IceCul" loading="lazy">
      </div>
    </div>
  </div>
</section>
