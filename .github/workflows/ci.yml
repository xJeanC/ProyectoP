name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el CI solo necesita leer el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (build + pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Pruebas unitarias
        run: npx ng test --watch=false
      - name: Build de producción
        run: npx ng build

  functions:
    name: Cloud Functions (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Compilación TypeScript
        run: npm run build
